<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager — Sign In / Register</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <!-- Core Application Logic -->
    <script type="text/javascript" src="js/code.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <!-- Title Header -->
                <div class="text-center mb-4">
                    <div class="app-icon-wrapper mb-3 mx-auto">
                        <i class="bi bi-person-lines-fill"></i>
                    </div>
                    <h1 id="title" class="fw-bold tracking-tight">Contacts App</h1>
                    <p class="text-secondary-contrast small mb-0">Personal Contacts Manager Portal</p>
                </div>

                <!-- Main Glassmorphism Card -->
                <div id="loginDiv" class="card glass-card shadow-lg border-0 p-4 p-sm-5">
                    <div class="card-body p-0">
                        
                        <!-- Nav Pills for Switching between Sign In and Register -->
                        <ul class="nav nav-pills nav-fill bg-body-tertiary p-1 rounded-pill mb-4 border" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active rounded-pill py-2 small fw-semibold text-uppercase tracking-wider" 
                                        id="tab-login" data-bs-toggle="pill" data-bs-target="#loginTabPane" type="button" role="tab" 
                                        aria-controls="loginTabPane" aria-selected="true">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link rounded-pill py-2 small fw-semibold text-uppercase tracking-wider" 
                                        id="tab-register" data-bs-toggle="pill" data-bs-target="#registerTabPane" type="button" role="tab" 
                                        aria-controls="registerTabPane" aria-selected="false">
                                    <i class="bi bi-person-plus me-1"></i> Register
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabsContent">
                            
                            <!-- ================= SIGN IN VIEW ================= -->
                            <div class="tab-pane fade show active" id="loginTabPane" role="tabpanel" aria-labelledby="tab-login" tabindex="0">
                                <span id="inner-title" class="d-block text-center fw-semibold text-uppercase tracking-wider mb-4 fs-6 text-secondary">
                                    Sign In to Your Account
                                </span>
                                
                                <form id="loginForm" onsubmit="event.preventDefault(); doLogin(event);" class="needs-validation">
                                    <!-- Username Input Group -->
                                    <div class="mb-3">
                                        <label for="loginName" class="form-label form-label-contrast small">Username</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                            <input type="text" id="loginName" class="form-control" placeholder="Enter username" 
                                                   autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
                                        </div>
                                    </div>
                                    
                                    <!-- Password Input Group -->
                                    <div class="mb-4">
                                        <label for="loginPassword" class="form-label form-label-contrast small">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                            <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" 
                                                   autocomplete="current-password" required />
                                        </div>
                                    </div>

                                    <!-- Login Button -->
                                    <button type="submit" id="loginButton" class="buttons btn btn-primary w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                        <span>Sign In</span>
                                        <i class="bi bi-arrow-right"></i>
                                    </button>
                                </form>

                                <!-- Feedback Result Message -->
                                <div class="mt-3 text-center">
                                    <span id="loginResult" class="small fw-semibold"></span>
                                </div>
                            </div>

                            <!-- ================= REGISTER VIEW ================= -->
                            <div class="tab-pane fade" id="registerTabPane" role="tabpanel" aria-labelledby="tab-register" tabindex="0">
                                <span class="d-block text-center fw-semibold text-uppercase tracking-wider mb-4 fs-6 text-secondary">
                                    Create a New Account
                                </span>
                                
                                <form id="registerForm" onsubmit="event.preventDefault(); doRegister(event);" class="needs-validation">
                                    <!-- First & Last Name row -->
                                    <div class="row g-2 mb-3">
                                        <div class="col-6">
                                            <label for="registerFirstName" class="form-label form-label-contrast small">First Name</label>
                                            <input type="text" id="registerFirstName" class="form-control" placeholder="Jane" 
                                                   autocomplete="given-name" required />
                                        </div>
                                        <div class="col-6">
                                            <label for="registerLastName" class="form-label form-label-contrast small">Last Name</label>
                                            <input type="text" id="registerLastName" class="form-control" placeholder="Doe" 
                                                   autocomplete="family-name" required />
                                        </div>
                                    </div>

                                    <!-- Register Username -->
                                    <div class="mb-3">
                                        <label for="registerUsername" class="form-label form-label-contrast small">Username</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                            <input type="text" id="registerUsername" class="form-control" placeholder="Choose a username" 
                                                   autocomplete="username" autocapitalize="none" spellcheck="false" required />
                                        </div>
                                    </div>
                                    
                                    <!-- Register Password -->
                                    <div class="mb-3">
                                        <label for="registerPassword" class="form-label form-label-contrast small">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                            <input type="password" id="registerPassword" class="form-control" placeholder="At least 8 characters" 
                                                   autocomplete="new-password" minlength="8" required />
                                        </div>
                                        <span class="text-secondary small d-block mt-1">Must be at least 8 characters.</span>
                                    </div>

                                    <!-- Confirm Password -->
                                    <div class="mb-4">
                                        <label for="registerConfirmPassword" class="form-label form-label-contrast small">Confirm Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-shield-lock text-secondary-contrast"></i></span>
                                            <input type="password" id="registerConfirmPassword" class="form-control" placeholder="Re-enter password" 
                                                   autocomplete="new-password" minlength="8" required />
                                        </div>
                                    </div>

                                    <!-- Register Button -->
                                    <button type="submit" id="registerButton" class="buttons btn btn-success w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                        <span>Create Account</span>
                                        <i class="bi bi-check2-circle"></i>
                                    </button>
                                </form>

                                <!-- Feedback Result Message -->
                                <div class="mt-3 text-center">
                                    <span id="registerResult" class="small fw-semibold"></span>
                                </div>
                            </div>

                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
        // Auto-switch to register tab if requested via URL hash (#register) or query (?tab=register)
        document.addEventListener("DOMContentLoaded", function() {
            if (window.location.hash === "#register" || new URLSearchParams(window.location.search).get("tab") === "register") {
                const regTabBtn = document.getElementById("tab-register");
                if (regTabBtn) {
                    const tabTrigger = new bootstrap.Tab(regTabBtn);
                    tabTrigger.show();
                }
            }
        });
    </script>
</body>
</html>
