<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Contact Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <h1>Contact Manager</h1>
  <p>Your address book, wherever you are.</p>
</header>

<main class="card">
  <div class="card__tab">Sign in</div>

  <div class="card__body">
    <p id="message" class="message" role="status" aria-live="polite" hidden></p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               autocomplete="username" autocapitalize="none"
               spellcheck="false" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>

      <button type="submit" id="submit" class="btn">Sign in</button>
    </form>
  </div>

  <div class="card__foot">
    No account yet? <a href="signup.html">Create one</a>
  </div>
</main>

<script src="js/auth.js"></script>
</body>
</html>
