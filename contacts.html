<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COP 4331 LAMP Stack Demo</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <!-- Scripts -->
    <script type="text/javascript" src="js/code.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            readCookie();
        }, false);
    </script>
</head>
<body class="py-4 py-md-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">

                <!-- Header / User Bar (Matching Colors App) -->
                <div class="d-flex flex-column flex-md-row align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary-subtle gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="app-icon-wrapper-sm">
                            <i class="bi bi-person-lines-fill"></i>
                        </div>
                        <div>
                            <h1 id="title" class="h3 fw-bold mb-0">Contacts App</h1>
                            <p class="text-secondary-contrast small mb-0">Contact Manager Portal</p>
                        </div>
                    </div>
                    
                    <!-- Logged In User Info & Logout Button -->
                    <div id="loggedInDiv" class="d-flex align-items-center gap-3 bg-body-tertiary px-3 py-2 rounded-pill border">
                        <span id="userName" class="small fw-medium text-body"></span>
                        <button type="button" id="logoutButton" class="buttons btn btn-outline-danger btn-sm rounded-pill px-3" onclick="doLogout();">
                            <i class="bi bi-box-arrow-right me-1"></i> Log Out
                        </button>
                    </div>
                </div>

                <!-- Access UI Card -->
                <div id="accessUIDiv" class="card glass-card shadow-lg border-0 p-4 p-md-5 mb-4">
                    <div class="card-body p-0">
                        <h2 class="h5 fw-bold mb-4 d-flex align-items-center gap-2 text-white">
                            <i class="bi bi-sliders text-primary"></i> Contact Manager
                        </h2>

                        <!-- Search Section (Matching Colors App) -->
                        <div class="section-card p-4 rounded-4 border mb-4">
                            <label for="searchText" class="form-label form-label-contrast small text-uppercase">Search Contacts</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                                <input type="text" id="searchText" class="form-control" placeholder="Search by name, email, or phone..." onkeyup="if(event.key === 'Enter') searchContacts();" />
                                <button type="button" id="searchContactButton" class="buttons btn btn-primary px-4 fw-semibold" onclick="searchContacts();">
                                    Search
                                </button>
                                <button type="button" class="btn btn-outline-secondary" onclick="clearSearch();" title="Clear Search">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                            <div class="mt-3">
                                <span id="contactSearchResult" class="text-info-wcag small fw-semibold"></span>
                                <div id="contactList" class="mt-2"></div>
                            </div>
                        </div>

                        <!-- Add Contact Section (Matching Colors App) -->
                        <div class="section-card p-4 rounded-4 border">
                            <label class="form-label form-label-contrast small text-uppercase mb-3">Add New Contact</label>
                            <form onsubmit="event.preventDefault(); addContact();">
                                <div class="row g-2 mb-3">
                                    <div class="col-12 col-sm-6">
                                        <label for="contactFirstName" class="form-label text-secondary small">First Name</label>
                                        <input type="text" id="contactFirstName" class="form-control" placeholder="Jane" required />
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label for="contactLastName" class="form-label text-secondary small">Last Name</label>
                                        <input type="text" id="contactLastName" class="form-control" placeholder="Doe" required />
                                    </div>
                                </div>
                                <div class="row g-2 mb-3">
                                    <div class="col-12 col-sm-6">
                                        <label for="contactEmail" class="form-label text-secondary small">Email Address</label>
                                        <input type="email" id="contactEmail" class="form-control" placeholder="jane@example.com" required />
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label for="contactPhone" class="form-label text-secondary small">Phone Number</label>
                                        <input type="tel" id="contactPhone" class="form-control" placeholder="(555) 123-4567" required />
                                    </div>
                                </div>
                                <button type="submit" id="addContactButton" class="buttons btn btn-success px-4 py-2 fw-semibold d-flex align-items-center gap-2">
                                    <i class="bi bi-plus-circle"></i>
                                    <span>Add Contact</span>
                                </button>
                            </form>
                            <div class="mt-2 text-start">
                                <span id="contactAddResult" class="small fw-semibold"></span>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Edit Contact Modal -->
    <div class="modal fade" id="editContactModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border">
                <div class="modal-header border-secondary-subtle">
                    <h2 class="modal-title fs-5 text-white">
                        <i class="bi bi-pencil-square text-primary me-2"></i>Edit Contact
                    </h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form onsubmit="event.preventDefault(); saveEditContact();">
                        <input type="hidden" id="editContactId" />
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="editFirstName" class="form-label text-secondary small">First Name</label>
                                <input type="text" id="editFirstName" class="form-control" required />
                            </div>
                            <div class="col-6">
                                <label for="editLastName" class="form-label text-secondary small">Last Name</label>
                                <input type="text" id="editLastName" class="form-control" required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="editEmail" class="form-label text-secondary small">Email Address</label>
                            <input type="email" id="editEmail" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="editPhone" class="form-label text-secondary small">Phone Number</label>
                            <input type="tel" id="editPhone" class="form-control" required />
                        </div>
                        <div class="text-start">
                            <span id="editContactResult" class="small fw-semibold"></span>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary-subtle">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveEditContact();">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
